<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orbit test harness</title>
<style>
  html, body { margin: 0; height: 100%; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  pre#results { display: none; }
</style>
</head>
<body>
<iframe id="frame" src="/" title="site under test"></iframe>
<pre id="results"></pre>
<script>
(function () {
  "use strict";
  var results = {};
  var frame = document.getElementById("frame");
  var resultsEl = document.getElementById("results");

  function record(key, value) { results[key] = value; }

  function luminance(hex) {
    var m = hex.match(/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
    if (!m) return null;
    var c = m.slice(1).map(function (h) { return parseInt(h, 16) / 255; })
      .map(function (v) { return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  function contrast(a, b) {
    var la = luminance(a), lb = luminance(b);
    if (la === null || lb === null) return null;
    var hi = Math.max(la, lb), lo = Math.min(la, lb);
    return (hi + 0.05) / (lo + 0.05);
  }

  frame.addEventListener("load", function () {
    var win = frame.contentWindow;
    var doc = frame.contentDocument;

    function test() {
      var w = win.innerWidth;
      record("viewportWidth", w);

      /* ---------- layout / responsiveness ---------- */
      var navToggle = doc.getElementById("nav-toggle");
      var themeToggle = doc.getElementById("theme-toggle");
      var siteNav = doc.getElementById("primary-menu");
      var header = doc.getElementById("site-header");

      record("navToggleDisplay", getComputedStyle(navToggle).display);
      record("menuVisibilityWhenClosed", getComputedStyle(siteNav).visibility);

      var docEl = doc.scrollingElement || doc.documentElement;
      record("horizontalOverflow", docEl.scrollWidth - docEl.clientWidth);

      var speakerGrid = doc.querySelector(".speaker-grid");
      var ticketGrid = doc.querySelector(".ticket-grid");
      record("speakerCols", getComputedStyle(speakerGrid).gridTemplateColumns.split(" ").length);
      record("ticketCols", getComputedStyle(ticketGrid).gridTemplateColumns.split(" ").length);

      var about = doc.querySelector(".about-inner");
      record("aboutCols", getComputedStyle(about).gridTemplateColumns.split(" ").length);

      /* ---------- nav toggle ---------- */
      record("navExpandedInitial", navToggle.getAttribute("aria-expanded"));
      var navToggleLabel = getComputedStyle(navToggle).display !== "none";
      if (navToggleLabel) {
        navToggle.click();
        record("navExpandedAfterClick", navToggle.getAttribute("aria-expanded"));
        record("headerNavOpenClass", header.classList.contains("nav-open"));
        record("menuVisibilityWhenOpen", getComputedStyle(siteNav).visibility);
        navToggle.click();
        record("navExpandedAfterSecondClick", navToggle.getAttribute("aria-expanded"));
        record("headerNavOpenAfterClose", header.classList.contains("nav-open"));
      } else {
        record("navToggleNotDisplayedOnDesktop", true);
      }

      /* ---------- theme ---------- */
      var themeBefore = doc.documentElement.getAttribute("data-theme");
      record("themeInitial", themeBefore);
      themeToggle.click();
      var themeAfter = doc.documentElement.getAttribute("data-theme");
      record("themeAfterClick", themeAfter);
      record("themeChanged", themeBefore !== themeAfter);
      record("themeStored", win.localStorage.getItem("orbit-theme"));
      record("themeAriaPressed", themeToggle.getAttribute("aria-pressed"));
      record("themeAriaLabel", themeToggle.getAttribute("aria-label"));

      /* ---------- schedule tabs ---------- */
      var tab2 = doc.getElementById("tab-day-2");
      var panel2 = doc.getElementById("panel-day-2");
      var panel1 = doc.getElementById("panel-day-1");
      tab2.click();
      record("tab2Selected", tab2.getAttribute("aria-selected"));
      record("panel2Visible", !panel2.hidden);
      record("panel1Hidden", panel1.hidden);
      var kb = new win.KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true });
      tab2.dispatchEvent(kb);
      record("tabAfterArrowRight", tab2.getAttribute("aria-selected"));

      /* ---------- newsletter ---------- */
      var form = doc.getElementById("newsletter-form");
      var email = doc.getElementById("email");
      var status = doc.getElementById("form-status");
      var notValid = function () {
        email.value = "";
        form.dispatchEvent(new win.Event("submit", { cancelable: true }));
      };
      var notValid2 = function () {
        email.value = "not-an-email";
        form.dispatchEvent(new win.Event("submit", { cancelable: true }));
      };
      var valid = function () {
        email.value = "ada@lovelace.dev";
        form.dispatchEvent(new win.Event("submit", { cancelable: true }));
      };

      notValid();
      record("emptyErrShown", status.textContent.trim().length > 0);
      record("emptyAriaInvalid", email.getAttribute("aria-invalid"));
      record("emptyStatusState", status.getAttribute("data-state"));

      notValid2();
      record("badErrShown", status.textContent.trim().length > 0);
      record("badAriaInvalid", email.getAttribute("aria-invalid"));

      valid();
      record("successShown", status.textContent.indexOf("You’re on the list") !== -1);
      record("successStatusState", status.getAttribute("data-state"));
      record("emailClearedAfterSuccess", email.value === "");
      record("successAriaInvalidCleared", email.hasAttribute("aria-invalid") === false);

      /* ---------- stats (final value fallback check) ---------- */
      var statEls = doc.querySelectorAll(".stat-number[data-count]");
      record("statText0", statEls[0] ? statEls[0].textContent : null);

      /* ---------- contrast checks (current computed colors) ---------- */
      var cs = getComputedStyle(doc.body);
      var headerBg = getComputedStyle(doc.querySelector(".site-header")).backgroundColor;
      var text = cs.color;
      var txtContrast = contrast(text, headerBg !== "rgba(0, 0, 0, 0)" ? hexFromRgba(headerBg, doc) : hexFromRgba(cs.backgroundColor, doc));
      record("bodyTextContrast", txtContrast ? Math.round(txtContrast * 100) / 100 : null);

      var mutedEl = doc.querySelector(".hero-meta");
      var mutedColor = getComputedStyle(mutedEl).color;
      var mutedContrast = contrast(mutedColor, hexFromRgba(cs.backgroundColor, doc));
      record("mutedTextContrast", mutedContrast ? Math.round(mutedContrast * 100) / 100 : null);

      resultsEl.textContent = "RESULTS:" + JSON.stringify(results);
    }

    function hexFromRgba(rgba, d) {
      var m = rgba.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
      if (!m) return null;
      function toHex(n) { return ("0" + Number(n).toString(16)).slice(-2); }
      return "#" + toHex(m[1]) + toHex(m[2]) + toHex(m[3]);
    }

    // give deferred scripts a beat, then run
    setTimeout(test, 400);
  });
})();
</script>
</body>
</html>
